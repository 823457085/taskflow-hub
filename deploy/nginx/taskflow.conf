# 替换 hub.example.com、工作台监听的服务器网卡 IPv4（192.0.2.10）与证书路径。
# 静态页面来自 preview-app 构建产物。
server {
    listen 80;
    server_name hub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hub.example.com;

    ssl_certificate     /etc/ssl/taskflow/fullchain.pem;
    ssl_certificate_key /etc/ssl/taskflow/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /opt/taskflow/web;
    index index.html;
    client_max_body_size 256k;

    # 工作台转发与个人 Agent：Bridge 长连接与流式回传（含 SSE、远程进程输出），不缓冲、不限大小
    location ~ ^/api/bridge/(tunnel|remote)/ {
        proxy_pass http://127.0.0.1:5187;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        client_body_timeout 1h;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5187;
        proxy_http_version 1.1;
        # 写请求校验 Origin 与 Host 一致，必须原样转发浏览器的 Host（含非默认端口）
        proxy_set_header Host $http_host;
        # API 只信任这一个由 Nginx 覆盖的头，用于登录与配对限流
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        # 本机 Bridge 长轮询最长 25 秒
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5187/health;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# 网页工作台复用已开放的 TCP 80，使用 HTTPS。单独匹配公网映射的网卡 IPv4。
server {
    listen 192.0.2.10:80 ssl http2;
    server_name hub.example.com;

    ssl_certificate     /etc/ssl/taskflow/fullchain.pem;
    ssl_certificate_key /etc/ssl/taskflow/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;

    # 明文 HTTP 80 仍跳到任务中心 HTTPS 443。
    error_page 497 = @taskflow_http_redirect;
    location @taskflow_http_redirect {
        return 301 https://hub.example.com$request_uri;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location = /__taskflow/callback {
        access_log off;
        proxy_pass http://127.0.0.1:5189;
    }

    location / {
        proxy_pass http://127.0.0.1:5189;
    }
}
