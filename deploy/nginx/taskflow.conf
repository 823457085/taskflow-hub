# 替换 hub.example.com 与证书路径。静态页面来自 preview-app 构建产物。
server {
    listen 80;
    server_name hub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hub.example.com;

    ssl_certificate     /etc/ssl/taskflow/fullchain.pem;
    ssl_certificate_key /etc/ssl/taskflow/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /opt/taskflow/web;
    index index.html;
    client_max_body_size 256k;

    location /api/ {
        proxy_pass http://127.0.0.1:5187;
        proxy_http_version 1.1;
        # 写请求校验 Origin 与 Host 一致，必须原样转发浏览器的 Host（含非默认端口）
        proxy_set_header Host $http_host;
        # API 只信任这一个由 Nginx 覆盖的头，用于登录与配对限流
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        # 本机 Bridge 长轮询最长 25 秒
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5187/health;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
